[package]
name = "st-api"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
log = "0.4.33"
rquickjs = "0.14.0"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
