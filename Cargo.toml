[package]
name = "steak"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
  "st-api",
]

[dependencies]
bytes = "1"
clap = { version = "4.6.6", features = ["derive"] }
fern = "0.7.1"
futures-util = "0.3"
log = "0.4.33"
st-api = { path = "st-api" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
